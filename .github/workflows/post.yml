name: Auto Post to Binance Square

on:
  schedule:
    - cron: '30 0 * * *'
    - cron: '30 8 * * *'
    - cron: '30 16 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Send post to Binance Square
        run: |
          curl -X POST "https://www.binance.com/bapi/composite/v1/public/pgc/openApi/content/add" \
            -H "X-Square-OpenAPI-Key: ${{ secrets.BINANCE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "clienttype: binanceSkill" \
            -d '{"bodyTextOnly": "Auto-post test from scheduled workflow! $BTC"}'
