name: Post to Binance Square

on:
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Send post to Binance Square
        run: |
          curl -X POST "https://www.binance.com/bapi/composite/v1/public/pgc/openApi/content/add" \
            -H "X-Square-OpenAPI-Key: ${{ secrets.BINANCE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "clienttype: binanceSkill" \
            -d '{"bodyTextOnly": "Hello from GitHub Actions! Testing my first automated post. $BTC"}'
